name: Feature request
description: Propose a change to wyrd-diff.
title: "[feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Lead with the problem, not the solution. Tell us who is hurting and why.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Concrete scenario beats abstract wish.
      placeholder: |
        When I review a 12-thread batch, I have to expand each thread by hand
        to read the payload before sending to the agent.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: API shape, UX, CLI flags. Sketches welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What did you try or rule out and why?
    validations:
      required: false

  - type: dropdown
    id: surface
    attributes:
      label: Which surface(s)?
      multiple: true
      options:
        - Desktop app (Tauri)
        - SvelteKit UI
        - CLI (wyrd-diff-cli)
        - MCP tools
        - Local HTTP API
        - SQLite schema / persistence
        - Docs
    validations:
      required: true

  - type: textarea
    id: agents
    attributes:
      label: Affected agent harnesses
      description: Claude Code, Codex, OpenCode, Gemini, custom, or N/A.
    validations:
      required: false
